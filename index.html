<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123e31">
  <meta name="description" content="四川麻将胡牌与出牌建议：支持定缺和灵活手牌张数。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23185640'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='%23f5d879'%3E%E8%83%A1%3C/text%3E%3C/svg%3E">
  <title>四川麻将工具箱</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">四川麻将 · 血战到底</p>
        <h1>四川麻将工具箱</h1>
        <p class="hero-copy">录入手牌，查看可胡牌或选择弃牌后的听牌。</p>
      </div>
      <div class="hero-mark" aria-hidden="true">胡</div>
    </header>

    <nav class="tool-nav" aria-label="工具切换">
      <button type="button" data-route="hu" aria-controls="hu-page">胡哪些牌</button>
      <button type="button" data-route="discard" aria-controls="discard-page">出牌建议</button>
    </nav>

    <div id="hu-page" data-page="hu">
      <section class="panel" aria-labelledby="missing-title">
        <div class="section-heading"><div><span class="step">01</span><h2 id="missing-title">选择定缺</h2></div><span class="hint">胡牌时手中不能有缺门</span></div>
        <div class="segmented" role="group" aria-label="定缺花色">
          <button type="button" data-missing-suit="0" aria-pressed="false">缺万</button>
          <button type="button" data-missing-suit="1" aria-pressed="false">缺筒</button>
          <button type="button" data-missing-suit="2" aria-pressed="false">缺条</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="picker-title">
        <div class="section-heading"><div><span class="step">02</span><h2 id="picker-title">添加手牌</h2></div><span id="hand-count" class="counter">0 / 14</span></div>
        <div id="tile-picker" class="tile-picker"></div>
        <div class="section-heading hand-heading"><div><h2 id="hand-title">当前手牌</h2></div>
          <div class="actions"><button id="undo-button" class="text-button" type="button">撤销</button><button id="clear-button" class="text-button danger" type="button">清空</button></div>
        </div>
        <div id="hand" class="hand" aria-live="polite"></div>
        <p id="status" class="status">请添加手牌。</p>
      </section>

      <section class="panel results-panel" aria-labelledby="results-title">
        <div class="section-heading"><div><span class="step">03</span><h2 id="results-title">可胡牌</h2></div></div>
        <div id="results" aria-live="polite"><div class="empty-state">添加手牌后，这里会显示可胡牌。</div></div>
      </section>
    </div>

    <div id="discard-page" data-page="discard" hidden>
      <section class="panel" aria-labelledby="discard-missing-title">
        <div class="section-heading"><div><span class="step">01</span><h2 id="discard-missing-title">选择定缺</h2></div><span class="hint">有定缺牌时必须优先打出</span></div>
        <div class="segmented" role="group" aria-label="出牌建议定缺花色">
          <button type="button" data-discard-missing-suit="0" aria-pressed="false">缺万</button>
          <button type="button" data-discard-missing-suit="1" aria-pressed="false">缺筒</button>
          <button type="button" data-discard-missing-suit="2" aria-pressed="false">缺条</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="discard-picker-title">
        <div class="section-heading"><div><span class="step">02</span><h2 id="discard-picker-title">添加摸牌后手牌</h2></div><span id="discard-hand-count" class="counter">0 / 14</span></div>
        <div id="discard-tile-picker" class="tile-picker"></div>
        <div class="section-heading hand-heading"><div><h2 id="discard-hand-title">当前手牌与弃牌选择</h2></div>
          <div class="actions"><button id="discard-undo-button" class="text-button" type="button">撤销</button><button id="discard-clear-button" class="text-button danger" type="button">清空</button></div>
        </div>
        <div id="discard-hand" class="hand discard-hand" aria-live="polite"></div>
        <p id="discard-status" class="status">请添加手牌。</p>
        <p id="discard-selection-summary" class="discard-selection-summary" aria-live="polite">尚未选择弃牌。</p>
      </section>

      <section class="panel results-panel" aria-labelledby="discard-results-title">
        <div class="section-heading"><div><span class="step">03</span><h2 id="discard-results-title">弃牌后可胡牌</h2></div><span class="hint">理论剩余数仅扣除已录入的手牌</span></div>
        <div id="discard-results" aria-live="polite"><div class="empty-state">选定弃牌后，这里会显示可胡牌与余张。</div></div>
      </section>
    </div>

    <footer>所有计算均在本机完成 · 不保存牌局</footer>
  </main>
  <script src="mahjong.js"></script>
  <script src="ui-common.js"></script>
  <script src="hu-page.js"></script>
  <script src="discard-page.js"></script>
  <script src="app.js"></script>
</body>
</html>
